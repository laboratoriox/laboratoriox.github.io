<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · JH Laboratoriox</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#E8ECF1; --ink:#14203A; --muted:#4B5870; --accent:#2F3CFF; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0F1A2E; --ink:#E6ECF8; --muted:#93A1BD; --accent:#8C9BFF; } }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:1.5rem; background:var(--bg); color:var(--ink); font:400 1.05rem/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
    main { max-width:28rem; }
    h1 { margin:0 0 .5rem; font-size:clamp(1.6rem,6vw,2.2rem); font-weight:400; letter-spacing:-.02em; }
    p { margin:0 0 1.5rem; color:var(--muted); }
    a { color:var(--ink); border-bottom:1px solid var(--ink); text-decoration:none; padding-bottom:2px; }
    a:hover, a:focus-visible { color:var(--accent); border-color:var(--accent); outline:none; }
  </style>
</head>
<body>
  <main>
    <h1>Essa página não existe.</h1>
    <p>O endereço pode ter mudado ou estar digitado errado.</p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
